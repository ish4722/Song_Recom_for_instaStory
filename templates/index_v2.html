<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image → Music Recommender</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#f8fafc}.wrap{max-width:1050px;margin:auto;padding:32px 20px 60px}header{text-align:center;margin-bottom:28px}h1{font-size:clamp(2rem,5vw,3.5rem);margin:0 0 8px}header p,.muted{color:#94a3b8}.panel{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:8px}input[type=text],input[type=file],select{width:100%;padding:12px;border:1px solid #475569;border-radius:10px;background:#0f172a;color:white}.filters{display:flex;flex-wrap:wrap;gap:8px}.filters label{background:#0f172a;border:1px solid #334155;border-radius:20px;padding:8px 12px;font-weight:500;cursor:pointer}.filters input{margin-right:6px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;background:#8b5cf6;color:white}button.secondary{background:#475569}button:disabled{opacity:.5;cursor:not-allowed}.drop{padding:30px;text-align:center;border:2px dashed #64748b;border-radius:14px}#preview{display:none;max-width:100%;max-height:280px;margin:15px auto 0;border-radius:12px}#loading,#results,#generation{display:none}.description{background:#0f172a;border-radius:12px;padding:16px;line-height:1.6;color:#dbeafe}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:18px}.card h3{margin:0 0 5px}.score{font-weight:800;margin:9px 0}.reason{color:#cbd5e1;font-size:.9rem;line-height:1.5}.actions{display:flex;gap:8px;margin-top:13px}.error{display:none;color:#fecaca;background:#450a0a;padding:12px;border-radius:10px;margin-top:12px}pre{white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body><div class="wrap">
<header><h1>Image → Music</h1><p>Multimodal semantic retrieval for the soundtrack that fits your image.</p></header>
<section class="panel"><form id="form"><div class="grid">
<div class="full"><label>Upload image</label><div class="drop"><input id="photo" name="photo" type="file" accept="image/*" required><img id="preview" alt="Preview"></div></div>
<div class="full"><label for="manual_description">Additional context</label><input id="manual_description" name="manual_description" type="text" placeholder="Optional context about the moment, people or vibe"></div>
<div><label for="mood">Mood</label><select id="mood" name="mood"><option value="">Automatic</option><option>happy</option><option>sad</option><option>energetic</option><option>calm</option><option>romantic</option><option>nostalgic</option><option>uplifting</option><option>melancholic</option><option>dramatic</option><option>peaceful</option></select></div>
<div><label>Languages</label><div class="filters"><label><input name="languages" value="Hindi" type="checkbox">Hindi</label><label><input name="languages" value="English" type="checkbox">English</label><label><input name="languages" value="Punjabi" type="checkbox">Punjabi</label><label><input name="languages" value="Tamil" type="checkbox">Tamil</label><label><input name="languages" value="Telugu" type="checkbox">Telugu</label><label><input name="languages" value="Haryanvi" type="checkbox">Haryanvi</label></div></div>
<div class="full"><label>Artist preferences</label><div class="filters"><label><input name="artists" value="Taylor Swift" type="checkbox">Taylor Swift</label><label><input name="artists" value="The Weeknd" type="checkbox">The Weeknd</label><label><input name="artists" value="Diljit Dosanjh" type="checkbox">Diljit Dosanjh</label><label><input name="artists" value="AP Dhillon" type="checkbox">AP Dhillon</label><label><input name="artists" value="Lana Del Rey" type="checkbox">Lana Del Rey</label></div></div>
</div><button id="submit" type="submit">Find matching songs</button><div id="error" class="error"></div></form></section>
<section id="loading" class="panel">Analyzing image → generating semantic context → searching vector indexes → re-ranking…</section>
<section id="results" class="panel"><h2>Image context</h2><div id="description" class="description"></div><h2>Top recommendations</h2><div id="cards" class="cards"></div><br><button id="generate" class="secondary">Generate an original song</button></section>
<section id="generation" class="panel"><h2>AI song generation</h2><p id="generationStatus" class="muted">Queued…</p><pre id="lyrics"></pre><div id="audio"></div></section>
</div>
<script>
const userId=localStorage.getItem('song_user')||crypto.randomUUID();localStorage.setItem('song_user',userId);let currentDescription='',currentMood='happy';
const preview=document.getElementById('preview');document.getElementById('photo').addEventListener('change',e=>{const f=e.target.files[0];if(f){preview.src=URL.createObjectURL(f);preview.style.display='block'}});
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function err(v){const e=document.getElementById('error');e.textContent=v||'';e.style.display=v?'block':'none'}
function cards(items){document.getElementById('cards').innerHTML=items.map((s,i)=>`<article class="card"><h3>${i+1}. ${esc(s.track)}</h3><div class="muted">${esc(s.artist)}</div><div class="score">Score ${Number(s.similarity).toFixed(3)}</div><div class="muted">Semantic ${Number(s.semantic_score).toFixed(3)} · Visual ${Number(s.image_score).toFixed(3)} · Mood ${Number(s.mood_score).toFixed(3)}</div><p class="reason">${esc(s.explanation)}</p><div class="actions"><button class="secondary" onclick="feedback(${JSON.stringify(s.artist)},${JSON.stringify(s.track)},'like')">♥ Like</button><button class="secondary" onclick="feedback(${JSON.stringify(s.artist)},${JSON.stringify(s.track)},'dislike')">Dislike</button></div></article>`).join('')}
async function feedback(artist,track,value){await fetch('/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,artist,track,feedback:value})})}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();err('');document.getElementById('loading').style.display='block';document.getElementById('results').style.display='none';currentMood=document.getElementById('mood').value||'happy';const fd=new FormData(e.target);fd.append('user_id',userId);try{const r=await fetch('/upload_photo',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.error||'Recommendation failed');currentDescription=d.refined_description;document.getElementById('description').textContent=currentDescription;cards(d.recommendations||[]);document.getElementById('results').style.display='block'}catch(x){err(x.message)}finally{document.getElementById('loading').style.display='none'}});
document.getElementById('generate').addEventListener('click',async()=>{document.getElementById('generation').style.display='block';const r=await fetch('/generate_song',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:currentDescription,mood:currentMood,genre:'pop',language:'English'})}),d=await r.json();if(!r.ok){document.getElementById('generationStatus').textContent=d.error;return}poll(d.job_id)});
async function poll(id){const r=await fetch('/song_status/'+id),d=await r.json();if(d.status==='completed'){document.getElementById('generationStatus').textContent='Generation complete.';document.getElementById('lyrics').textContent=d.lyrics||'';document.getElementById('audio').innerHTML=d.audio_url?`<audio controls src="${d.audio_url}"></audio>`:'';return}if(d.status==='failed'){document.getElementById('generationStatus').textContent=d.error;return}document.getElementById('generationStatus').textContent='Generating…';setTimeout(()=>poll(id),3000)}
</script></body></html>
